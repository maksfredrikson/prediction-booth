<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prediction Booth</title>
<meta name="description" content="Donate your view of the Netherlands: mark how you see the country today and where you predict it is heading. You get a pattern of dots, a short scenario text and a donation receipt.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23111'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23f4f2ee'/%3E%3C/svg%3E">
<script>try { var t = localStorage.getItem("prediction-booth-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header class="menubar">
  <a class="menubar__brand" href="index.html">Prediction Booth</a>
  <nav aria-label="Pages">
    <a href="index.html" aria-current="page">Survey</a>
    <a href="explore.html">Explore</a>
    <a href="about.html">About</a>
  </nav>
  <button class="theme" type="button" aria-label="Switch between light and dark">Dark</button>
</header>

<div class="shell">
  <aside class="panel panel--side" aria-label="Receipt">
    <div class="panel__title" id="side-title">Receipt</div>
    <div class="panel__body" id="side"></div>
  </aside>
  <main class="panel panel--main">
    <h1 class="panel__title" id="main-title">Survey</h1>
    <div class="panel__body" id="screen">
      <noscript><p>Prediction Booth needs JavaScript to run. Nothing is sent anywhere: your answer stays in this browser.</p></noscript>
    </div>
  </main>
</div>

<footer class="keybar" id="keys" aria-label="Actions"></footer>

<script type="module" src="js/chrome.js"></script>
<script type="module" src="js/survey.js"></script>
</body>
</html>
